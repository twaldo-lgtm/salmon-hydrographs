// ── IV trace state ────────────────────────────────────────────────────────────
let iv_x     = null;
let iv_y     = null;
let iv_dates = null;

// ── Convert a date string to fractional month position ───────────────────────
function dateToFracMonth(dateStr) {
  const d        = new Date(dateStr);
  const month    = d.getMonth() + 1;
  const day      = d.getDate();
  const daysInMo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return month + (day - 1) / daysInMo;
}

// ── Build the IV Plotly trace from stored iv_x / iv_y ────────────────────────
function buildIvTrace() {
  return {
    x:    iv_x,
    y:    iv_y,
    mode: 'lines',
    name: 'Live IV — last 30 days',
    line: { color: '#1a9e1a', width: 1.5 },
    hovertemplate: '%{text}<br>%{y:,.0f} cfs<extra>Live IV</extra>',
    text: iv_dates,
    xaxis: 'x',
    yaxis: 'y'
  };
}

// ── Switch species/run ────────────────────────────────────────────────────────
function switchSpecies(key) {
  const figData = JSON.parse(FIGURES[key]);
  if (iv_x !== null && iv_x.length > 0) {
    figData.data.push(buildIvTrace());
  }
  Plotly.react('chart', figData.data, figData.layout, {responsive: true});
  document.getElementById('table-wrap').innerHTML = TABLES[key];
}

// ── Fetch IV data from USGS NWIS on page load ─────────────────────────────────
async function fetchIV() {
  const statusEl = document.getElementById('iv-status');
  const url = (
    'https://waterservices.usgs.gov/nwis/iv/' +
    '?format=json' +
    '&sites=' + SITE_ID +
    '&parameterCd=00060' +
    '&period=P30D'
  );

  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();

    const series = data?.value?.timeSeries;
    if (!series || series.length === 0) {
      statusEl.innerHTML = '<span class="iv-none">No real-time data available for this site.</span>';
      return;
    }

    const values = series[0]?.values?.[0]?.value ?? [];
    if (values.length === 0) {
      statusEl.innerHTML = '<span class="iv-none">No real-time data available for this site.</span>';
      return;
    }

    const valid = values.filter(v => parseFloat(v.value) > 0);
    if (valid.length === 0) {
      statusEl.innerHTML = '<span class="iv-none">No valid real-time readings in last 30 days.</span>';
      return;
    }

    // Deduplicate to daily median to avoid overplotting 15-min intervals
    const daily = {};
    for (const v of valid) {
      const d = v.dateTime.slice(0, 10);
      if (!daily[d]) daily[d] = [];
      daily[d].push(parseFloat(v.value));
    }
    const dailyDates = Object.keys(daily).sort();
    iv_dates = dailyDates;
    iv_y     = dailyDates.map(d => {
      const vals = daily[d].slice().sort((a, b) => a - b);
      return vals[Math.floor(vals.length / 2)];
    });
    iv_x = dailyDates.map(d => {
      const parts = d.split('-');
      const mo    = parseInt(parts[1]);
      const dy    = parseInt(parts[2]);
      const yr    = parseInt(parts[0]);
      const dim   = new Date(yr, mo, 0).getDate();
      return mo + (dy - 1) / dim;
    });

    const latestDate = dailyDates[dailyDates.length - 1];
    const latestCfs  = iv_y[iv_y.length - 1].toLocaleString(
      undefined, {maximumFractionDigits: 0}
    );
    statusEl.innerHTML = (
      '<span class="iv-live">&#9679; Real-time data loaded — ' +
      'latest reading: <b>' + latestCfs + ' cfs</b> (' + latestDate + ')</span>'
    );

    // Re-render current chart with IV trace added
    const currentKey = document.getElementById('sp-select').value;
    switchSpecies(currentKey);

  } catch (err) {
    statusEl.innerHTML = '<span class="iv-error">Real-time data unavailable: ' + err.message + '</span>';
  }
}

// ── Init: render DV chart immediately, fetch IV asynchronously ────────────────
const firstKey = Object.keys(FIGURES)[0];
document.getElementById('sp-select').value = firstKey;
switchSpecies(firstKey);
fetchIV();
</script>
